<!doctype html>
<!--
  Xtream Nova — trailer host page.

  YouTube's embedded player refuses to play unless it can identify the web
  page hosting it (error 153). An app's WebView has no web identity, so this
  page provides one: the app loads  https://<your-domain>/?v=<youtube-key>
  and the player runs here, legitimately.

  Contract with the app (TrailerPlayerView):
   - reads the YouTube key from the `v` query parameter (validated)
   - posts 'playing' / 'error' to webkit.messageHandlers.player when present,
     so the app can fade the video in, or silently keep its photo
   - plays inline, sound on, looping, no controls — the app's hero look

  This file is self-contained and static: nothing to build, nothing to
  maintain, no data collected.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Trailer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  function notifyApp(state) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.player) {
        window.webkit.messageHandlers.player.postMessage(state);
      }
    } catch (e) { /* running in a plain browser — fine */ }
  }

  // Strictly validate the key: YouTube ids are 11 chars of [A-Za-z0-9_-].
  // Anything else is refused outright — this page must never interpolate
  // arbitrary input.
  var key = new URLSearchParams(location.search).get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(key)) {
    notifyApp('error');
  } else {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      new YT.Player('player', {
        videoId: key,
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          loop: 1,
          playlist: key
        },
        events: {
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) { notifyApp('playing'); }
          },
          onError: function () { notifyApp('error'); }
        }
      });
    };
  }
</script>
</body>
</html>
